<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg-indigo" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B0420" />
      <stop offset="50%" stop-color="#150936" />
      <stop offset="100%" stop-color="#280D58" />
    </linearGradient>
    <linearGradient id="neon-rim" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>
    <linearGradient id="ear-inner-l" x1="115" y1="95" x2="190" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#FF2A85" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="ear-inner-r" x1="397" y1="95" x2="322" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF2A85" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="play-grad" x1="205" y1="220" x2="325" y2="345" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F5FF" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>
    <filter id="neon-glow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Indigo/Violet Rounded App Icon Background -->
  <rect width="512" height="512" rx="116" fill="url(#bg-indigo)" />
  <rect x="18" y="18" width="476" height="476" rx="100" stroke="url(#neon-rim)" stroke-opacity="0.45" stroke-width="4" />

  <!-- Subtle Neon Halo Ring -->
  <circle cx="256" cy="280" r="168" stroke="#00F5FF" stroke-opacity="0.16" stroke-width="2.5" stroke-dasharray="10 8" />

  <!-- Stylized Nekomimi (Cat Ears Silhouette) with Cyan/Magenta Neon Contour -->
  <g filter="url(#neon-glow)">
    <path
      d="M104 268 L116 94 L212 178 C226 173 241 170 256 170 C271 170 286 173 300 178 L396 94 L408 268 C416 348 356 418 256 418 C156 418 96 348 104 268 Z"
      fill="#110629"
      stroke="url(#neon-rim)"
      stroke-width="15"
      stroke-linejoin="round"
    />
  </g>

  <!-- Inner Nekomimi Ear Triangles -->
  <polygon points="132,132 126,222 192,182" fill="url(#ear-inner-l)" />
  <polygon points="380,132 386,222 320,182" fill="url(#ear-inner-r)" />

  <!-- Central Glowing Play Icon Inside Nekomimi -->
  <g filter="url(#neon-glow)">
    <path
      d="M222 232 L316 288 L222 344 Z"
      fill="url(#play-grad)"
      stroke="#E0F2FE"
      stroke-width="4"
      stroke-linejoin="round"
    />
  </g>
</svg>
